{{- template "base" .}}

{{- define "extra_css"}}
<style>
    .paste-preview-image {
        max-height: 220px;
        object-fit: contain;
    }
    .paste-text-item {
        white-space: pre-wrap;
        word-break: break-word;
    }
    .paste-image-thumb {
        aspect-ratio: 1 / 1;
        object-fit: cover;
        width: 100%;
        background: var(--bs-gray-100);
    }
</style>
{{- end}}

{{- define "page_body"}}
{{- template "errmsg" ""}}
<input type="hidden" name="_form_token" value="{{.CSRFToken}}">
<div class="card shadow-sm mb-6">
    <div class="card-header bg-light">
        <h3 data-i18n="title.paste" class="card-title section-title">Paste</h3>
    </div>
    <div class="card-body">
        <div class="d-flex gap-4 align-items-start">
            <div class="flex-grow-1">
                <textarea id="paste_text_preview" class="form-control rounded-1 min-h-150px" placeholder="Paste text here"></textarea>
                <div id="paste_image_preview_wrap" class="d-none border rounded-1 p-4 text-center">
                    <img id="paste_image_preview" class="paste-preview-image" alt="Paste preview">
                </div>
            </div>
            <button id="paste_action_btn" type="button" class="btn btn-icon btn-primary">
                <i id="paste_action_icon" class="ki-duotone ki-copy fs-1">
                    <span class="path1"></span>
                    <span class="path2"></span>
                </i>
            </button>
        </div>
    </div>
</div>

<div class="row g-6">
    <div class="col-xl-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-light">
                <h3 class="card-title section-title">Text</h3>
            </div>
            <div id="paste_text_list" class="card-body d-flex flex-column gap-4"></div>
        </div>
    </div>
    <div class="col-xl-6">
        <div class="card shadow-sm h-100">
            <div class="card-header bg-light">
                <h3 class="card-title section-title">Images</h3>
            </div>
            <div class="card-body">
                <div id="paste_image_grid" class="row g-4"></div>
            </div>
        </div>
    </div>
</div>
{{- end}}

{{- define "extra_js"}}
<script>
    const pasteItemsURL = '{{.PasteItemsURL}}';
    const pasteTextURL = '{{.PasteTextURL}}';
    const pasteImageURL = '{{.PasteImageURL}}';
    const fileURL = '{{.FileURL}}';
    const csrfToken = '{{.CSRFToken}}';
    let pendingPaste = null;

    function setUploadState(enabled) {
        const icon = $('#paste_action_icon');
        icon.removeClass('ki-copy ki-cloud-add').addClass(enabled ? 'ki-cloud-add' : 'ki-copy');
    }

    function clearPastePreview() {
        pendingPaste = null;
        $('#paste_text_preview').val('').removeClass('d-none');
        $('#paste_image_preview_wrap').addClass('d-none');
        $('#paste_image_preview').removeAttr('src');
        setUploadState(false);
    }

    async function readClipboard() {
        if (navigator.clipboard && navigator.clipboard.read) {
            const items = await navigator.clipboard.read();
            for (const item of items) {
                const imageType = item.types.find((type) => type.startsWith('image/'));
                if (imageType) {
                    const blob = await item.getType(imageType);
                    pendingPaste = {type: 'image', blob};
                    $('#paste_text_preview').addClass('d-none');
                    $('#paste_image_preview').attr('src', URL.createObjectURL(blob));
                    $('#paste_image_preview_wrap').removeClass('d-none');
                    setUploadState(true);
                    return;
                }
            }
        }
        const text = await navigator.clipboard.readText();
        pendingPaste = {type: 'text', text};
        $('#paste_text_preview').val(text).removeClass('d-none');
        $('#paste_image_preview_wrap').addClass('d-none');
        setUploadState(text.trim().length > 0);
    }

    async function uploadPendingPaste() {
        if (!pendingPaste) {
            await readClipboard();
            return;
        }
        if (pendingPaste.type === 'text') {
            const content = $('#paste_text_preview').val();
            await axios.post(pasteTextURL, {content}, {
                headers: {'X-CSRF-TOKEN': csrfToken}
            });
        } else {
            await axios.post(`${pasteImageURL}?name=clipboard.png`, pendingPaste.blob, {
                headers: {
                    'Content-Type': pendingPaste.blob.type || 'image/png',
                    'X-CSRF-TOKEN': csrfToken
                }
            });
        }
        clearPastePreview();
        await loadPasteItems();
    }

    function formatPasteDate(value) {
        if (!value) {
            return '';
        }
        return new Date(value).toLocaleString();
    }

    async function copyTextToClipboard(text) {
        try {
            if (!navigator.clipboard || !navigator.clipboard.writeText) {
                throw new Error('Clipboard API is unavailable');
            }
            await navigator.clipboard.writeText(text);
        } catch (clipboardError) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            const copied = document.execCommand('copy');
            textarea.remove();
            if (!copied) {
                throw clipboardError;
            }
        }
        showToast(1, 'general.copied');
    }

    function showPasteError(err) {
        ModalAlert.fire({
            text: err.toString(),
            icon: 'error'
        });
    }

    async function copyImage(path) {
        const resp = await axios.get(`${fileURL}?path=${encodeURIComponent(path)}&inline=1`, {
            responseType: 'blob',
            headers: {'X-CSRF-TOKEN': csrfToken}
        });
        if (navigator.clipboard && window.ClipboardItem) {
            await navigator.clipboard.write([new ClipboardItem({[resp.data.type]: resp.data})]);
        }
    }

    async function renderImage(item, img) {
        const resp = await axios.get(`${fileURL}?path=${encodeURIComponent(item.path)}&inline=1`, {
            responseType: 'blob',
            headers: {'X-CSRF-TOKEN': csrfToken}
        });
        img.src = URL.createObjectURL(resp.data);
    }

    function confirmDelete(item) {
        ModalAlert.fire({
            text: `Delete ${item.name || item.id}?`,
            icon: 'question',
            buttonsStyling: false,
            showCancelButton: true,
            confirmButtonText: $.t('general.delete_confirm_btn'),
            cancelButtonText: $.t('general.cancel'),
            customClass: {
                confirmButton: 'btn btn-danger',
                cancelButton: 'btn btn-secondary'
            }
        }).then(async function(result) {
            if (result.isConfirmed) {
                await axios.delete(`{{.PasteURL}}/${encodeURIComponent(item.id)}`, {
                    headers: {'X-CSRF-TOKEN': csrfToken}
                });
                await loadPasteItems();
            }
        });
    }

    function renderTextItems(items) {
        const container = $('#paste_text_list');
        container.empty();
        items.forEach((item) => {
            const row = $(`
                <div class="border rounded-1 p-4">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div class="flex-grow-1">
                            <div class="paste-text-item text-gray-800"></div>
                            <div class="text-muted fs-8 mt-2"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-icon btn-light-primary paste-copy">
                                <i class="ki-duotone ki-copy fs-2"><span class="path1"></span><span class="path2"></span></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-icon btn-light-danger paste-delete">
                                <i class="ki-duotone ki-trash fs-2"><span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span><span class="path5"></span></i>
                            </button>
                        </div>
                    </div>
                </div>`);
            row.find('.paste-text-item').text(item.content || '');
            row.find('.text-muted').text(formatPasteDate(item.created_at));
            row.find('.paste-copy').on('click', () => {
                copyTextToClipboard(item.content || '').catch(showPasteError);
            });
            row.find('.paste-delete').on('click', () => confirmDelete(item));
            container.append(row);
        });
    }

    function renderImageItems(items) {
        const grid = $('#paste_image_grid');
        grid.empty();
        items.forEach((item) => {
            const col = $(`
                <div class="col-6 col-md-4">
                    <div class="border rounded-1 overflow-hidden">
                        <img class="paste-image-thumb" alt="">
                        <div class="d-flex justify-content-between align-items-center p-2">
                            <button type="button" class="btn btn-sm btn-icon btn-light-primary paste-copy">
                                <i class="ki-duotone ki-copy fs-2"><span class="path1"></span><span class="path2"></span></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-icon btn-light-danger paste-delete">
                                <i class="ki-duotone ki-trash fs-2"><span class="path1"></span><span class="path2"></span><span class="path3"></span><span class="path4"></span><span class="path5"></span></i>
                            </button>
                        </div>
                    </div>
                </div>`);
            renderImage(item, col.find('img')[0]);
            col.find('.paste-copy').on('click', () => copyImage(item.path));
            col.find('.paste-delete').on('click', () => confirmDelete(item));
            grid.append(col);
        });
    }

    async function loadPasteItems() {
        const resp = await axios.get(pasteItemsURL);
        const items = resp.data || [];
        renderTextItems(items.filter((item) => item.type === 'text'));
        renderImageItems(items.filter((item) => item.type === 'image'));
    }

    $(document).ready(function() {
        $('#paste_action_btn').on('click', function() {
            uploadPendingPaste().catch(showPasteError);
        });
        $('#paste_text_preview').on('input', function() {
            const content = $(this).val();
            pendingPaste = content.trim() ? {type: 'text', text: content} : null;
            setUploadState(!!pendingPaste);
        });
        loadPasteItems();
    });
</script>
{{- end}}
